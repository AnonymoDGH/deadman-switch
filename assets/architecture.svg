<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="820" height="440" fill="url(#bg)"/>
  <text x="410" y="40" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">Dead Man's Switch — Architecture</text>

  <!-- Heartbeat file -->
  <rect x="40" y="110" width="180" height="70" rx="10" fill="url(#box)" stroke="#58a6ff" stroke-width="2"/>
  <text x="130" y="140" fill="#58a6ff" font-size="14" font-weight="600" text-anchor="middle">heartbeat file</text>
  <text x="130" y="162" fill="#8b949e" font-size="12" text-anchor="middle">mtime = last proof of life</text>

  <!-- Config -->
  <rect x="40" y="220" width="180" height="70" rx="10" fill="url(#box)" stroke="#58a6ff" stroke-width="2"/>
  <text x="130" y="250" fill="#58a6ff" font-size="14" font-weight="600" text-anchor="middle">config.json</text>
  <text x="130" y="272" fill="#8b949e" font-size="12" text-anchor="middle">TTL + payload type</text>

  <!-- Watchdog -->
  <rect x="320" y="150" width="180" height="100" rx="10" fill="url(#box)" stroke="#f0883e" stroke-width="2"/>
  <text x="410" y="185" fill="#f0883e" font-size="15" font-weight="700" text-anchor="middle">watchdog</text>
  <text x="410" y="207" fill="#8b949e" font-size="12" text-anchor="middle">checks every N seconds</text>
  <text x="410" y="225" fill="#8b949e" font-size="12" text-anchor="middle">age = now − mtime</text>

  <!-- Decision -->
  <polygon points="595,130 705,200 595,270 485,200" fill="url(#box)" stroke="#f85149" stroke-width="2"/>
  <text x="595" y="196" fill="#f85149" font-size="13" font-weight="700" text-anchor="middle">age &gt; TTL?</text>
  <text x="595" y="214" fill="#8b949e" font-size="11" text-anchor="middle">or never beat?</text>

  <!-- Payloads -->
  <rect x="650" y="330" width="150" height="90" rx="10" fill="url(#box)" stroke="#3fb950" stroke-width="2"/>
  <text x="725" y="358" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">payload</text>
  <text x="725" y="380" fill="#8b949e" font-size="12" text-anchor="middle">print · webhook</text>
  <text x="725" y="398" fill="#8b949e" font-size="12" text-anchor="middle">email · command</text>

  <!-- Arrow heartbeat -> watchdog -->
  <path d="M 220 145 C 270 145, 280 180, 320 185" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Arrow config -> watchdog -->
  <path d="M 220 255 C 270 255, 280 230, 320 215" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Arrow watchdog -> decision -->
  <path d="M 500 200 L 485 200" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Decision no -> loop back -->
  <path d="M 595 270 C 595 330, 410 330, 410 250" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="505" y="348" fill="#8b949e" font-size="12">no — keep beating</text>
  <!-- Decision yes -> payload -->
  <path d="M 650 210 C 700 210, 700 320, 725 330" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arr)"/>
  <text x="700" y="268" fill="#3fb950" font-size="12" font-weight="600">yes — fire</text>

  <text x="410" y="420" fill="#8b949e" font-size="11" text-anchor="middle">Fiction prop for novel research. Use on systems you own.</text>
</svg>
