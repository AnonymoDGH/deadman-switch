[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadman-switch"
version = "0.1.0"
description = "A heartbeat watchdog that fires a payload (webhook, email, command) when you go silent."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["dead-man-switch", "watchdog", "heartbeat", "espionage", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

[project.scripts]
dms = "deadman_switch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
